<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Observatorio de Qualidade do Ar</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="hero">
      <div>
        <p class="eyebrow">Sistemas Distribuidos</p>
        <h1>Observatorio de Qualidade do Ar</h1>
        <p>Cadastre e consulte medicoes ambientais coletadas por estacoes urbanas.</p>
      </div>
      <span id="api-status" class="status checking" role="status">Verificando API</span>
    </header>

    <main>
      <section class="card editor" aria-labelledby="editor-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Medicao</p>
            <h2 id="editor-title">Nova leitura</h2>
          </div>
          <button id="cancel-edit" class="button ghost" type="button" hidden>Cancelar edicao</button>
        </div>

        <form id="reading-form">
          <input id="reading-id" type="hidden">
          <div class="form-grid">
            <label>Estacao<input id="stationCode" maxlength="20" required placeholder="ST-001"></label>
            <label>Cidade<input id="city" maxlength="100" required placeholder="Porto Alegre"></label>
            <label>Poluente
              <select id="pollutant" required>
                <option>PM2.5</option><option>PM10</option><option>CO</option>
                <option>NO2</option><option>SO2</option><option>O3</option>
              </select>
            </label>
            <label>Data e hora<input id="measuredAt" type="datetime-local" required></label>
            <label>Valor<input id="measuredValue" type="number" min="0" step="0.001" required></label>
            <label>Unidade<input id="unit" maxlength="16" required value="ug/m3"></label>
            <label>Classificacao
              <select id="qualityStatus" required>
                <option value="good">Boa</option>
                <option value="moderate">Moderada</option>
                <option value="unhealthy">Prejudicial</option>
                <option value="critical">Critica</option>
              </select>
            </label>
            <label class="wide">Observacoes<textarea id="notes" maxlength="1000" rows="3"></textarea></label>
          </div>
          <button class="button primary" type="submit">Salvar medicao</button>
        </form>
      </section>

      <section class="card records" aria-labelledby="records-title">
        <div class="section-heading">
          <div><p class="eyebrow">Base de dados</p><h2 id="records-title">Medicoes registradas</h2></div>
          <strong id="total-label">0 registros</strong>
        </div>

        <form id="filters" class="filters">
          <label>Cidade<input id="filter-city" placeholder="Todas"></label>
          <label>Poluente
            <select id="filter-pollutant">
              <option value="">Todos</option><option>PM2.5</option><option>PM10</option>
              <option>CO</option><option>NO2</option><option>SO2</option><option>O3</option>
            </select>
          </label>
          <label>De<input id="filter-from" type="date"></label>
          <label>Ate<input id="filter-to" type="date"></label>
          <div class="filter-actions">
            <button class="button primary" type="submit">Filtrar</button>
            <button id="clear-filters" class="button ghost" type="button">Limpar</button>
          </div>
        </form>

        <p id="message" class="message" role="status" aria-live="polite"></p>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Estacao</th><th>Cidade</th><th>Poluente</th><th>Medicao</th><th>Valor</th><th>Status</th><th>Acoes</th></tr></thead>
            <tbody id="readings-body"></tbody>
          </table>
        </div>
        <nav class="pagination" aria-label="Paginacao">
          <button id="previous" class="button ghost" type="button">Anterior</button>
          <span id="page-label">Pagina 1</span>
          <button id="next" class="button ghost" type="button">Proxima</button>
        </nav>
      </section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
