# HAProxy: ponto de entrada unico da aplicacao.
#   :3000  balanceia as tres replicas da API (camada web, sem estado)
#   :5000  encaminha conexoes SQL ao primario atual do PostgreSQL (escritas)
#   :5001  encaminha conexoes SQL as replicas de leitura (hot standby)
#   :8404  pagina de estatisticas com o estado de cada servidor
# Quem e primario ou replica e decidido pelo Patroni; o HAProxy apenas consulta
# a API REST de cada no (porta 8008) a cada segundo.

global
    log stdout format raw local0 info
    maxconn 4096

defaults
    log global
    option dontlognull
    # So registra conexoes anormais (erros, retries, servidores caindo).
    option dontlog-normal
    timeout connect 1s
    timeout client 60s
    timeout server 60s
    timeout queue 5s
    timeout check 500ms
    retries 3

# DNS interno do Docker: reavalia o IP de containers que reiniciam.
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold other 10s
    hold refused 10s
    hold nx 10s
    hold timeout 10s
    hold valid 10s
    hold obsolete 10s

listen stats
    mode http
    bind *:8404
    stats enable
    stats uri /
    stats refresh 2s
    stats show-legends

# ---------------------------------------------------------------------------
# Camada web
# ---------------------------------------------------------------------------
frontend api_in
    mode http
    bind *:3000
    option httplog
    default_backend api_servers

backend api_servers
    mode http
    balance roundrobin
    # Verificacao ativa: /health/live responde 200 enquanto o processo aceita
    # trabalho e 503 durante o desligamento gracioso. Nao depende do banco: se o
    # banco cair, retirar todas as APIs do balanceamento nao ajudaria em nada.
    option httpchk
    http-check send meth GET uri /health/live
    http-check expect status 200
    # Reenvio da requisicao a outra replica quando a conexao falha ou a replica
    # morre sem responder. Um POST so e reenviado nesses casos se trouxer
    # Idempotency-Key; sem a chave, apenas falhas de conexao (requisicao ainda nao
    # entregue) sao repetidas.
    option redispatch 1
    retry-on conn-failure empty-response junk-response
    http-request disable-l7-retry if METH_POST !{ req.hdr(idempotency-key) -m found }
    # Na rede local uma conexao saudavel abre em microssegundos; uma replica morta
    # simplesmente nao responde. Alem da verificacao ativa, o trafego real tambem
    # conta: tres falhas de conexao seguidas ja marcam a replica como DOWN.
    timeout connect 300ms
    default-server check inter 1s fastinter 500ms downinter 1s fall 2 rise 2 observe layer4 error-limit 3 on-error mark-down resolvers docker init-addr last,libc,none
    server api1 api1:3000
    server api2 api2:3000
    server api3 api3:3000

# ---------------------------------------------------------------------------
# Camada de dados
# ---------------------------------------------------------------------------
listen pg_primary
    mode tcp
    bind *:5000
    # Na rede local do Docker uma conexao leva menos de 1 ms; um no morto nao
    # responde. Desistir rapido evita segurar a aplicacao esperando por ele.
    timeout connect 500ms
    retries 1
    # GET /primary devolve 200 apenas no lider do Patroni.
    option httpchk
    http-check send meth OPTIONS uri /primary
    http-check expect status 200
    # Ao marcar um servidor como DOWN, derruba as sessoes abertas com ele para
    # que os clientes reconectem no novo primario.
    default-server check port 8008 inter 500ms fastinter 250ms downinter 1s fall 2 rise 1 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none
    server pg1 pg1:5432
    server pg2 pg2:5432
    server pg3 pg3:5432

listen pg_replicas
    mode tcp
    bind *:5001
    balance roundrobin
    timeout connect 500ms
    retries 1
    option redispatch
    # GET /replica devolve 200 em replicas saudaveis com atraso menor que 8 MiB.
    option httpchk
    http-check send meth OPTIONS uri /replica?lag=8MB
    http-check expect status 200
    default-server check port 8008 inter 500ms fastinter 250ms downinter 1s fall 2 rise 1 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none
    server pg1 pg1:5432
    server pg2 pg2:5432
    server pg3 pg3:5432
