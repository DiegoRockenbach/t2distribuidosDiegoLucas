<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" role="img" aria-label="Arquitetura replicada: os clientes chegam ao HAProxy, que distribui entre três réplicas da API; a API escreve no primário e lê das réplicas pelo HAProxy; o primário envia o WAL às duas réplicas; os nós do banco usam o etcd para eleger o primário." font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#315d83"/>
    </marker>
    <marker id="seta-cinza" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d8b97"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="610" fill="#ffffff"/>

  <!-- Clientes -->
  <rect x="355" y="10" width="250" height="40" rx="4" fill="#f7fafc" stroke="#315d83" stroke-width="1.4"/>
  <text x="480" y="35" text-anchor="middle" font-size="14" font-weight="700" fill="#20252b">Clientes (JMeter / navegador)</text>
  <line x1="480" y1="50" x2="480" y2="86" stroke="#315d83" stroke-width="1.6" marker-end="url(#seta)"/>

  <!-- HAProxy HTTP -->
  <rect x="250" y="88" width="460" height="50" rx="4" fill="#f7fafc" stroke="#315d83" stroke-width="1.4"/>
  <text x="480" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#20252b">HAProxy — porta 3000</text>
  <text x="480" y="127" text-anchor="middle" font-size="12" fill="#48545f">distribui entre as APIs e retira a que falhar</text>

  <line x1="340" y1="138" x2="222" y2="183" stroke="#315d83" stroke-width="1.6" marker-end="url(#seta)"/>
  <line x1="480" y1="138" x2="480" y2="183" stroke="#315d83" stroke-width="1.6" marker-end="url(#seta)"/>
  <line x1="620" y1="138" x2="738" y2="183" stroke="#315d83" stroke-width="1.6" marker-end="url(#seta)"/>

  <!-- APIs -->
  <rect x="110" y="186" width="200" height="50" rx="4" fill="#f7fafc" stroke="#315d83" stroke-width="1.4"/>
  <text x="210" y="207" text-anchor="middle" font-size="14" font-weight="700" fill="#20252b">API 1</text>
  <text x="210" y="225" text-anchor="middle" font-size="12" fill="#48545f">Fastify, sem estado</text>
  <rect x="380" y="186" width="200" height="50" rx="4" fill="#f7fafc" stroke="#315d83" stroke-width="1.4"/>
  <text x="480" y="207" text-anchor="middle" font-size="14" font-weight="700" fill="#20252b">API 2</text>
  <text x="480" y="225" text-anchor="middle" font-size="12" fill="#48545f">Fastify, sem estado</text>
  <rect x="650" y="186" width="200" height="50" rx="4" fill="#f7fafc" stroke="#315d83" stroke-width="1.4"/>
  <text x="750" y="207" text-anchor="middle" font-size="14" font-weight="700" fill="#20252b">API 3</text>
  <text x="750" y="225" text-anchor="middle" font-size="12" fill="#48545f">Fastify, sem estado</text>

  <line x1="222" y1="236" x2="340" y2="281" stroke="#315d83" stroke-width="1.6" marker-end="url(#seta)"/>
  <line x1="480" y1="236" x2="480" y2="281" stroke="#315d83" stroke-width="1.6" marker-end="url(#seta)"/>
  <line x1="738" y1="236" x2="620" y2="281" stroke="#315d83" stroke-width="1.6" marker-end="url(#seta)"/>

  <!-- HAProxy SQL -->
  <rect x="250" y="284" width="460" height="50" rx="4" fill="#f7fafc" stroke="#315d83" stroke-width="1.4"/>
  <text x="480" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#20252b">HAProxy — portas 5000 e 5001</text>
  <text x="480" y="323" text-anchor="middle" font-size="12" fill="#48545f">5000: escritas no primário · 5001: leituras nas réplicas</text>

  <line x1="340" y1="334" x2="222" y2="389" stroke="#315d83" stroke-width="1.6" marker-end="url(#seta)"/>
  <line x1="480" y1="334" x2="480" y2="389" stroke="#315d83" stroke-width="2.2" marker-end="url(#seta)"/>
  <line x1="620" y1="334" x2="738" y2="389" stroke="#315d83" stroke-width="1.6" marker-end="url(#seta)"/>
  <text x="250" y="366" text-anchor="end" font-size="12" fill="#48545f">leituras</text>
  <text x="490" y="366" font-size="12" fill="#48545f">escritas</text>
  <text x="710" y="366" font-size="12" fill="#48545f">leituras</text>

  <!-- PostgreSQL -->
  <rect x="110" y="392" width="200" height="56" rx="4" fill="#f7fafc" stroke="#315d83" stroke-width="1.4"/>
  <text x="210" y="415" text-anchor="middle" font-size="14" font-weight="700" fill="#20252b">PostgreSQL — réplica</text>
  <text x="210" y="434" text-anchor="middle" font-size="12" fill="#48545f">Patroni · somente leitura</text>
  <rect x="380" y="392" width="200" height="56" rx="4" fill="#dce7f1" stroke="#17395c" stroke-width="2.2"/>
  <text x="480" y="415" text-anchor="middle" font-size="14" font-weight="700" fill="#17395c">PostgreSQL — primário</text>
  <text x="480" y="434" text-anchor="middle" font-size="12" fill="#48545f">Patroni · aceita escritas</text>
  <rect x="650" y="392" width="200" height="56" rx="4" fill="#f7fafc" stroke="#315d83" stroke-width="1.4"/>
  <text x="750" y="415" text-anchor="middle" font-size="14" font-weight="700" fill="#20252b">PostgreSQL — réplica</text>
  <text x="750" y="434" text-anchor="middle" font-size="12" fill="#48545f">Patroni · somente leitura</text>

  <line x1="380" y1="420" x2="313" y2="420" stroke="#17395c" stroke-width="2.2" marker-end="url(#seta)"/>
  <text x="346" y="412" text-anchor="middle" font-size="12" font-weight="700" fill="#17395c">WAL</text>
  <line x1="580" y1="420" x2="647" y2="420" stroke="#17395c" stroke-width="2.2" marker-end="url(#seta)"/>
  <text x="614" y="412" text-anchor="middle" font-size="12" font-weight="700" fill="#17395c">WAL</text>

  <!-- etcd -->
  <line x1="210" y1="448" x2="300" y2="533" stroke="#7d8b97" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#seta-cinza)"/>
  <line x1="480" y1="448" x2="480" y2="533" stroke="#7d8b97" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#seta-cinza)"/>
  <line x1="750" y1="448" x2="660" y2="533" stroke="#7d8b97" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#seta-cinza)"/>
  <text x="490" y="496" font-size="12" fill="#48545f">renova a chave de líder a cada 2 s</text>

  <rect x="250" y="536" width="460" height="54" rx="4" fill="#f7fafc" stroke="#315d83" stroke-width="1.4"/>
  <text x="480" y="558" text-anchor="middle" font-size="14" font-weight="700" fill="#20252b">etcd — 3 membros</text>
  <text x="480" y="577" text-anchor="middle" font-size="12" fill="#48545f">guarda quem é o primário (chave com TTL de 20 s, consenso Raft)</text>
</svg>
